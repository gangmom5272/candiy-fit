# DB migrations (S15P31A403-66). Usage: infra/README.md section "DB migration (Alembic)".
# Keep this file ASCII only: Alembic reads it with the OS locale encoding (cp949 on Korean Windows).
# From backend/: uv run alembic upgrade head
# The DB URL is not stored here. env.py builds it from the repo root .env (app.core.config.Settings).
# Another DB: uv run alembic -x url=postgresql+asyncpg://... upgrade head

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# File name: 20261022_1530_<rev>_<slug>.py (sorted by creation time, KST)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = Asia/Seoul
truncate_slug_length = 40

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
level = NOTSET
formatter = generic
args = (sys.stderr,)
class = StreamHandler

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
