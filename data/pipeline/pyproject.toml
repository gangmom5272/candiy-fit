[project]
name = "candiy-pipeline"
version = "0.1.0"
description = "캔디핏 건강데이터 파이프라인 - CANDiY 원본 조회·적재, 동기화 상태 기록"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/candiy_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not db'"
markers = [
    "db: 로컬 PostgreSQL(infra/docker-compose.yml)이 필요한 테스트",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
